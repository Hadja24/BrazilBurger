# config/packages/security.yaml
security:
    password_hashers:
        App\Entity\Account: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Account
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email  # <-- AJOUTEZ CETTE LIGNE
                password_parameter: password
                default_target_path: app_admin_dashboard
                enable_csrf: true
            logout:
                path: app_logout  # Juste 'path', pas 'target'
                target: app_login

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_MANAGER }